[project]
name = "vault"
version = "1.0.0"
description = "Digital product platform for Discord communities"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiomysql",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "redis",
    "httpx",
    "discord.py",
    "PyJWT",
    "stripe",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
